spring.application.name=Psico

# URL de conexion a la base de datos PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}

# Nombre de usuario para la base de datos
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}

# Contrasena para la base de datos
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Controlador para PostgreSQL
spring.datasource.driverClassName=org.postgresql.Driver

# Configuracion de Hibernate para actualizar el esquema de la base de datos
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL ejecutadas
spring.jpa.show-sql=true

# Puerto del Servidor
server.port=${PORT:8080}

